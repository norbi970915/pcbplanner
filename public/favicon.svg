<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>PCB Planner signal waveform</title>
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#20252b"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11.5" fill="none" stroke="#3a424c"/>
  <!-- A bold digital waveform, with enough separation to read at 16 pixels. -->
  <path d="M10 43 H19 V21 H32 V43 H45 V21 H54"
