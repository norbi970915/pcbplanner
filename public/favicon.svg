<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>pcbplanner</title>
  <!-- board -->
  <rect x="1" y="1" width="62" height="62" rx="11" fill="#20252b"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none" stroke="#3a424c" stroke-width="1"/>
  <!-- placement grid -->
  <g fill="#3a424c">
    <circle cx="12" cy="12" r="1"/><circle cx="52" cy="12" r="1"/>
    <circle cx="52" cy="52" r="1"/><circle cx="12" cy="32" r="1"/>
    <circle cx="52" cy="32" r="1"/><circle cx="32" cy="52" r="1"/>
    <circle cx="42" cy="52" r="1"/>
  </g>
  <!-- the "P": a routed trace with 45° corners -->
  <path d="M22 44 V20 Q22 16 26 16 H37 L45 24 V28 L37 36 H22"
        fill="none" stroke="#e0953f" stroke-width="6.5" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- plated via at the foot of the P -->
  <circle cx="22" cy="47.5" r="7" fill="#e0953f"/>
  <circle cx="22" cy="47.5" r="2.8" fill="#20252b"/>
</svg>
