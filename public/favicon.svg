<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>pcbplanner</title>
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#20252b"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11.5" fill="none" stroke="#3a424c"/>
  <!-- A PCB outline with a clipped corner and a single 45-degree route. -->
  <path d="M14 11 H42 L53 22 V50 Q53 53 50 53 H14 Q11 53 11 50 V14 Q11 11 14 11 Z"
        fill="none" stroke="#e0953f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M23 42 V33 L34 22 H41"
        fill="none" stroke="#e0953f" stroke-width="5" stroke-linejoin="round"/>
  <!-- Plated pads stay distinct at favicon sizes. -->
  <g fill="#e0953f">
    <circle cx="23" cy="42" r="5.5"/>
    <circle cx="41" cy="22" r="5.5"/>
  </g>
  <g fill="#20252b">
    <circle cx="23" cy="42" r="2"/>
    <circle cx="41" cy="22" r="2"/>
  </g>
</svg>
