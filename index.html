<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCB Toolkit – impedance field solver and PCB design calculators</title>
    <meta name="description" content="Free PCB design calculators: impedance field solver (microstrip, stripline, differential), trace width and current, via, stackup, timing, skin effect and fusing current." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    
    
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        var s = JSON.parse(localStorage.getItem('pcbtk-settings') || '{}');
        var dark = s.theme !== 'light' && (s.theme !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This calculator needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
