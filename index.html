    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "pcbplanner",
        "url": "https://pcbplanner.com/",
        "applicationCategory": "EngineeringApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "PCB impedance field solver, stackup advisor, trace width, via, thermal, crosstalk, PDN and electronics calculators."
      }
    </script>
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        var s = JSON.parse(localStorage.getItem('pcbtk-settings') || '{}');
        var dark = s.theme !== 'light' && (s.theme !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>pcbplanner needs JavaScript to run its calculators.</noscript>
    <script type="module" src="/src/main.tsx"></script>
